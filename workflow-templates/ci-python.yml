# Reusable Python CI — canonical template (starter workflow).
# Callable copy for cross-repo `uses:` lives at
# CloudCrane-Software/.github/.github/workflows/ci-python.yml
name: Python CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy .
      - name: Test (pytest)
        run: uv run pytest -v
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            .pytest_cache/
            **/junit*.xml
          if-no-files-found: ignore
